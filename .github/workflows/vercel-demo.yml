name: Vercel Demo Quality

on:
  push:
    branches: [main]
    paths:
      - 'vercel-app/**'
      - '.github/workflows/vercel-demo.yml'
  pull_request:
    paths:
      - 'vercel-app/**'
      - '.github/workflows/vercel-demo.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install FastAPI dependencies for HTML smoke tests
        run: python -m pip install -r vercel-app/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q vercel-app
      - name: Check JavaScript syntax
        run: node --check vercel-app/templates/app.js
      - name: Check dashboard v2 JavaScript syntax
        run: node --check vercel-app/templates/upgrade.js
      - name: Check futuristic command center JS syntax
        run: node --check vercel-app/templates/studio.js
      - name: Check integrations JavaScript syntax
        run: node --check vercel-app/templates/integrations.js
      - name: Check responsive interactions JavaScript syntax
        run: node --check vercel-app/templates/responsive.js
      - name: Test synthetic data engine
        run: python -m unittest discover -s vercel-app/tests -v


  cross-device:
    name: Viewports / ${{ matrix.browser }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install API and Playwright
        run: |
          python -m pip install -r vercel-app/requirements.txt
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start demo and test phone, tablet and desktop viewports
        env:
          DASHBOARD_TEST_URL: http://127.0.0.1:8765/
        run: |
          (cd vercel-app && python -m uvicorn app:app --host 127.0.0.1 --port 8765 >/tmp/ea-mobile-server.log 2>&1) &
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/api/dashboard?period=90d >/dev/null; then break; fi
            sleep 1
          done
          python vercel-app/scripts/check_viewports.py --browser ${{ matrix.browser }}
