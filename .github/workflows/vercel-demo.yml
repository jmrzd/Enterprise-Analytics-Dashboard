name: Vercel Demo Quality

on:
  push:
    branches: [main]
    paths:
      - 'vercel-app/**'
      - '.github/workflows/vercel-demo.yml'
  pull_request:
    paths:
      - 'vercel-app/**'
      - '.github/workflows/vercel-demo.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install FastAPI dependencies for HTML smoke tests
        run: python -m pip install -r vercel-app/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q vercel-app
      - name: Check JavaScript syntax
        run: node --check vercel-app/templates/app.js
      - name: Check dashboard v2 JavaScript syntax
        run: node --check vercel-app/templates/upgrade.js
      - name: Test synthetic data engine
        run: python -m unittest discover -s vercel-app/tests -v
