name: Python quality checks

on:
  push:
  pull_request:

jobs:
  unit:
    name: Syntax & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py src scripts tests
      - run: python -m pytest -q tests/test_metrics.py tests/test_charts.py tests/test_structure.py

  integration:
    name: PostgreSQL & Streamlit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql+psycopg://dashboard:dashboard@localhost:5432/enterprise_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare PostgreSQL with synthetic dataset
        run: docker compose up -d --wait
      - run: python -m pip install -r requirements.txt
      - name: Validate queries and all dashboard pages
        run: python -m pytest -q tests/test_integration.py
      - name: Stop database
        if: always()
        run: docker compose down
